name: la-casa-de-la-nana

services:
  mongodb:
    image: mongo:7
    container_name: nana-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - nana-mongo-data:/data/db
    networks:
      - nana-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rest-api:
    build:
      context: .
      dockerfile: services/rest-api/Dockerfile
    image: nana/rest-api:latest
    container_name: nana-rest-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
    ports:
      - "${REST_PORT:-4000}:4000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nana-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  graphql-api:
    build:
      context: .
      dockerfile: services/graphql-api/Dockerfile
    image: nana/graphql-api:latest
    container_name: nana-graphql-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4001
    ports:
      - "${GRAPHQL_PORT:-4001}:4001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nana-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grpc-api:
    build:
      context: .
      dockerfile: services/grpc-api/Dockerfile
    image: nana/grpc-api:latest
    container_name: nana-grpc-api
    restart: unless-stopped
    env_file: .env
    environment:
      GRPC_PORT: 50051
    ports:
      - "${GRPC_HOST_PORT:-50051}:50051"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nana-network

volumes:
  nana-mongo-data:
    name: nana-mongo-data

networks:
  nana-network:
    name: nana-network
    driver: bridge
